name: mem2act-address-first
on:
  pull_request:
    paths:
      - 'researchstrong/address_first_diagnostic.py'
      - '.github/workflows/mem2act-address-first.yml'
  workflow_dispatch:
jobs:
  address-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run masked address-first diagnostic
        working-directory: researchstrong
        run: python address_first_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-address-first-result
          path: researchstrong/address_first_diagnostic_result.json
