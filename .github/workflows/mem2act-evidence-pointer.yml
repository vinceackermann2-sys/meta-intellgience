name: mem2act-evidence-pointer
on:
  pull_request:
    paths:
      - 'researchstrong/evidence_pointer_router.py'
      - '.github/workflows/mem2act-evidence-pointer.yml'
  workflow_dispatch:
jobs:
  evidence-pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run evidence-preserving exact pointer router
        working-directory: researchstrong
        run: python evidence_pointer_router.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-evidence-pointer-result
          path: researchstrong/evidence_pointer_router_result.json
