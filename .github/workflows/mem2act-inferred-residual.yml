name: mem2act-inferred-residual
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/inferred_residual_diagnostic.py'
      - '.github/workflows/mem2act-inferred-residual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inferred-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn transformers python-dateutil pycountry webcolors
      - name: Run inferred residual diagnostic
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python inferred_residual_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem2act-inferred-residual-result
          path: researchstrong/inferred_residual_diagnostic_result.json
          retention-days: 90
