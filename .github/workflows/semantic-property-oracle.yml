name: semantic-property-oracle
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_semantic/property_candidate_oracle.py'
      - '.github/workflows/semantic-property-oracle.yml'
permissions:
  contents: read
jobs:
  semantic-property-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers pycountry webcolors
      - name: Run semantic property candidate oracle
        working-directory: research_semantic
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python property_candidate_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-property-oracle-result
          path: research_semantic/property_candidate_oracle_result.json
          retention-days: 90
