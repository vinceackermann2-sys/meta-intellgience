name: mem2act-crossencoder-router
on:
  pull_request:
    paths:
      - 'researchstrong/crossencoder_candidate_router.py'
      - '.github/workflows/mem2act-crossencoder-router.yml'
  workflow_dispatch:
jobs:
  crossencoder-router:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir datasets sentence-transformers scikit-learn
      - name: Run cross-encoder candidate router
        working-directory: researchstrong
        run: python crossencoder_candidate_router.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: mem2act-crossencoder-router-result
          path: researchstrong/crossencoder_candidate_router_result.json
