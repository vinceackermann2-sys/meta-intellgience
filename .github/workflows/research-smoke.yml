name: research-real-gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'researchbreakthrough/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-banking77:
    if: startsWith(github.head_ref, 'research/real-memory-gates')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run full Banking77 benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python researchbreakthrough/full_banking77.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-banking77-result
          path: researchbreakthrough/full_banking77_result.json
          if-no-files-found: warn
          retention-days: 30
