name: research-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'researchbreakthrough/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: startsWith(github.head_ref, 'research/real-memory-gates')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smoke
        run: |
          python -V
          python researchbreakthrough/smoke.py
