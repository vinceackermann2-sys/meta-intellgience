name: extractive-proposition-reader
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_semantic/extractive_proposition_reader.py'
      - '.github/workflows/proposition-availability.yml'
permissions:
  contents: read
jobs:
  extractive-proposition-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers transformers pycountry webcolors
      - name: Run extractive proposition reader
        working-directory: research_semantic
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python extractive_proposition_reader.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extractive-proposition-reader-result
          path: research_semantic/extractive_proposition_reader_result.json
          retention-days: 90
