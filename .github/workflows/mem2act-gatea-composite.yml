name: mem2act-gatea-composite
on:
  pull_request:
    paths:
      - 'researchstrong/gatea_composite.py'
      - '.github/workflows/mem2act-gatea-composite.yml'
  workflow_dispatch:
jobs:
  gatea-composite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run frozen-development Gate A composite
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python gatea_composite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem2act-gatea-composite-result
          path: researchstrong/gatea_composite_result.json
          if-no-files-found: warn
