name: semantic-binding-layer-audit
on:
  pull_request:
    branches: [research/semantic-world-model-20260820]
    paths:
      - 'researchstrong/semantic_binding_layer_audit.py'
      - '.github/workflows/semantic-binding-layer-audit.yml'
permissions:
  contents: read
jobs:
  layer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run semantic binding layer decomposition
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_binding_layer_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-binding-layer-audit-result
          path: researchstrong/semantic_binding_layer_audit_result.json
          retention-days: 90
