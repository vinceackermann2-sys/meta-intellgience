name: mem2act-episode-scope
on:
  pull_request:
    paths:
      - 'researchstrong/episode_scope_oracle.py'
      - '.github/workflows/mem2act-episode-scope.yml'
  workflow_dispatch:
jobs:
  episode-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run episode scope oracle
        working-directory: researchstrong
        run: python episode_scope_oracle.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-episode-scope-result
          path: researchstrong/episode_scope_oracle_result.json
