name: semantic-anchor-crossencoder
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_anchor_crossencoder.py'
      - '.github/workflows/semantic-anchor-crossencoder.yml'
permissions:
  contents: read
jobs:
  anchor-crossencoder:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run anchor-scoped cross-encoder binder
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_anchor_crossencoder.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-anchor-crossencoder-result
          path: researchstrong/semantic_anchor_crossencoder_result.json
          retention-days: 90
