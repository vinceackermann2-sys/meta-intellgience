name: mem2act-episode-scoped-router
on:
  pull_request:
    paths:
      - 'researchstrong/episode_scoped_router.py'
      - '.github/workflows/mem2act-episode-scoped-router.yml'
  workflow_dispatch:
jobs:
  episode-scoped-router:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run episode-scoped exact-value router
        working-directory: researchstrong
        run: python episode_scoped_router.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-episode-scoped-router-result
          path: researchstrong/episode_scoped_router_result.json
