name: mem2act-action-state-graph
on:
  pull_request:
    paths:
      - 'researchstrong/action_state_graph_diagnostic.py'
      - '.github/workflows/mem2act-action-state-graph.yml'
  workflow_dispatch:
jobs:
  action-state-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run action-state graph diagnostic
        working-directory: researchstrong
        run: python action_state_graph_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-action-state-graph-result
          path: researchstrong/action_state_graph_diagnostic_result.json
