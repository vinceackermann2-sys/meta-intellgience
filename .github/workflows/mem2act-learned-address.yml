name: mem2act-learned-address
on:
  pull_request:
    paths:
      - 'researchstrong/learned_address_resolver.py'
      - '.github/workflows/mem2act-learned-address.yml'
  workflow_dispatch:
jobs:
  learned-address:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run learned value-blind address resolver
        working-directory: researchstrong
        run: python learned_address_resolver.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-learned-address-result
          path: researchstrong/learned_address_resolver_result.json
