name: semantic-focus-field-binding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  focus-field-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/semantic-world-model-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run focus-conditioned field binding CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_focus_field_binding_cv.py
      - name: Persist research result to isolated branch
        run: |
          git config user.name 'research-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add researchstrong/semantic_focus_field_binding_cv_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record focus-field binding result'
          git push origin HEAD:research/semantic-world-model-20260820
