name: semantic-world-model-ingest-oracles
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/semantic-world-model-ingest-oracles.yml'
permissions:
  contents: read
jobs:
  ingest-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run query-independent property ingest oracle
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_property_ingest_oracle.py
      - name: Run query-independent semantic concept ingest oracle
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_concept_ingest_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-world-model-ingest-oracle-results
          path: |
            researchstrong/semantic_property_ingest_oracle_result.json
            researchstrong/semantic_concept_ingest_oracle_result.json
          retention-days: 90
