name: semantic-world-model-weighted-role-bridge
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_role_bridge_weighted_cv.py'
      - '.github/workflows/mab-inspect.yml'
permissions:
  contents: read
jobs:
  weighted-role-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run informativeness-weighted semantic role bridge CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_role_bridge_weighted_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-role-bridge-weighted-result
          path: researchstrong/semantic_role_bridge_weighted_cv_result.json
          retention-days: 90
