name: semantic-role-bridge-cv
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_role_bridge_cv.py'
      - 'researchstrong/semantic_role_bridge.py'
      - '.github/workflows/semantic-role-bridge.yml'
permissions:
  contents: read
jobs:
  role-bridge-ridge:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run value-blind semantic role bridge CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_role_bridge_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-role-bridge-ridge-result
          path: researchstrong/semantic_role_bridge_cv_result.json
          retention-days: 90
  role-bridge-bilinear-unseen-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run strict unseen-tool bilinear role bridge
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_role_bridge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-role-bridge-bilinear-result
          path: researchstrong/semantic_role_bridge_result.json
          retention-days: 90
