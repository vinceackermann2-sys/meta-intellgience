name: semantic-world-role-bridge
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_role_bridge.py'
      - '.github/workflows/semantic-role-bridge.yml'
permissions:
  contents: read
jobs:
  semantic-role-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run value-masked semantic role bridge CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_role_bridge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-role-bridge-result
          path: researchstrong/semantic_role_bridge_result.json
          retention-days: 90
