name: semantic-role-bridge-cv
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_semantic/semantic_role_bridge_cv.py'
      - '.github/workflows/semantic-role-bridge.yml'
permissions:
  contents: read
jobs:
  semantic-role-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run semantic role bridge CV
        working-directory: research_semantic
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_role_bridge_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-role-bridge-cv-result
          path: research_semantic/semantic_role_bridge_cv_result.json
          retention-days: 90
