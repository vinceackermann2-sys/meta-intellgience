name: mem2act-record-role
on:
  pull_request:
    paths:
      - 'researchstrong/record_role_diagnostic.py'
      - '.github/workflows/mem2act-record-role.yml'
  workflow_dispatch:
jobs:
  record-role:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run record-role diagnostic
        working-directory: researchstrong
        run: python record_role_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-record-role-result
          path: researchstrong/record_role_diagnostic_result.json
