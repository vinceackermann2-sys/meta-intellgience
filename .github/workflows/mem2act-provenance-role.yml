name: mem2act-provenance-role
on:
  pull_request:
    paths:
      - 'researchstrong/provenance_role_router.py'
      - '.github/workflows/mem2act-provenance-role.yml'
  workflow_dispatch:
jobs:
  provenance-role:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run provenance-role router
        working-directory: researchstrong
        run: python provenance_role_router.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-provenance-role-result
          path: researchstrong/provenance_role_router_result.json
