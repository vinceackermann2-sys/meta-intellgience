name: mem2act-joint-schema
on:
  pull_request:
    paths:
      - 'researchstrong/joint_schema_alignment.py'
      - '.github/workflows/mem2act-joint-schema.yml'
  workflow_dispatch:
jobs:
  joint-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run joint schema alignment
        working-directory: researchstrong
        run: python joint_schema_alignment.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-joint-schema-result
          path: researchstrong/joint_schema_alignment_result.json
