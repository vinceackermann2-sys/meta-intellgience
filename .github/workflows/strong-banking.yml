name: strong-banking-gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strong-baselines:
    if: startsWith(github.head_ref, 'research/strong-banking-gates')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir datasets sentence-transformers scikit-learn
      - name: Run strong full-data baselines
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python researchstrong/strong_banking77.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-banking77-result
          path: researchstrong/strong_banking77_result.json
          if-no-files-found: warn
          retention-days: 30
