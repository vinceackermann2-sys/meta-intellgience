name: mem2act-lineage-candidate-oracle
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/lineage_candidate_oracle.py'
      - '.github/workflows/mem2act-selective-vm.yml'
permissions:
  contents: read
jobs:
  lineage-candidate-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run lineage coverage oracle
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python lineage_candidate_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem2act-lineage-candidate-oracle-result
          path: researchstrong/lineage_candidate_oracle_result.json
          retention-days: 90
