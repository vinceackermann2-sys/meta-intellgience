name: mem2act-inferred-residual-v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/inferred_residual_v2.py'
      - '.github/workflows/mem2act-selective-vm.yml'
permissions:
  contents: read
jobs:
  inferred-residual-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn transformers python-dateutil pycountry webcolors
      - name: Run residual semantic-capacity comparison
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python inferred_residual_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem2act-inferred-residual-v2-result
          path: researchstrong/inferred_residual_v2_result.json
          retention-days: 90
