name: mem2act-gatea-source-selector-cached
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/gatea_source_selector_cached.py'
      - '.github/workflows/mem2act-gatea-source-selector-cached.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gatea-source-selector-cached:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run cached source selector
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python gatea_source_selector_cached.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem2act-gatea-source-selector-cached-result
          path: researchstrong/gatea_source_selector_cached_result.json
          retention-days: 90
