name: semantic-world-model-strict-ingest-oracle
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_property_ingest_oracle.py'
      - '.github/workflows/mem2act-slotvm-policy.yml'
permissions:
  contents: read
jobs:
  strict-ingest-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run query-independent semantic property oracle
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_property_ingest_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-property-ingest-oracle-result
          path: researchstrong/semantic_property_ingest_oracle_result.json
          retention-days: 90
