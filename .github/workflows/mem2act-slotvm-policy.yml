name: mem2act-slotvm-policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/slotvm_policy_runner.py'
      - 'researchstrong/strong_banking77.py'
      - '.github/workflows/mem2act-slotvm-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slotvm-policy:
    if: startsWith(github.head_ref, 'research/mem2act-slotvm-policy')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir datasets sentence-transformers scikit-learn
      - name: Run slot VM with general schema policies
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python researchstrong/slotvm_policy_runner.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mem2act-slotvm-policy-result
          path: researchstrong/slotvm_policy_result.json
          if-no-files-found: warn
          retention-days: 30
