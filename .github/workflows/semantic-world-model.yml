name: semantic-world-model-concept-state
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_concept_ingest_oracle.py'
      - 'researchstrong/semantic_property_ingest_oracle.py'
      - 'researchstrong/mem2act_repaired_sessions.py'
      - '.github/workflows/semantic-world-model.yml'
permissions:
  contents: read
jobs:
  concept-property-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run query-independent semantic concept world-state oracle
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_concept_ingest_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-concept-ingest-result
          path: researchstrong/semantic_concept_ingest_oracle_result.json
          retention-days: 90
