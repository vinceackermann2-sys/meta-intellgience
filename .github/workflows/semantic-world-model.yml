name: semantic-world-model-audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_missing_inferred_audit.py'
      - '.github/workflows/semantic-world-model.yml'
permissions:
  contents: read
jobs:
  missing-inferred-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Audit missing inferred properties
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_missing_inferred_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-missing-inferred-audit-result
          path: researchstrong/semantic_missing_inferred_audit_result.json
          retention-days: 90
