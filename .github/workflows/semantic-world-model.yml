name: semantic-world-binding-cv
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_world_binding_cv.py'
      - '.github/workflows/semantic-world-model.yml'
permissions:
  contents: read
jobs:
  semantic-world-binding-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run semantic world binding CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_world_binding_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-world-binding-cv-result
          path: researchstrong/semantic_world_binding_cv_result.json
          retention-days: 30
