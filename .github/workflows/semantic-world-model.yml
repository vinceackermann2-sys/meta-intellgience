name: semantic-entity-hierarchy-smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_entity_hierarchy_smoke.py'
      - '.github/workflows/semantic-world-model.yml'
permissions:
  contents: read
jobs:
  entity-hierarchy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run 30-QA hierarchical semantic entity-record smoke
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_entity_hierarchy_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-entity-hierarchy-smoke-result
          path: researchstrong/semantic_entity_hierarchy_smoke_result.json
          retention-days: 30
