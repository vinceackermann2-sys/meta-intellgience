name: semantic-world-model-gates
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/semantic_*.py'
      - 'researchstrong/SEMANTIC_WORLD_MODEL_GATE.md'
      - '.github/workflows/semantic-world-model.yml'
permissions:
  contents: read
jobs:
  property-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run strict ingest world-state oracle
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_property_ingest_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-property-ingest-result
          path: researchstrong/semantic_property_ingest_oracle_result.json
          retention-days: 90

  role-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run semantic role bridge CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_role_bridge_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-role-bridge-result
          path: researchstrong/semantic_role_bridge_cv_result.json
          retention-days: 90

  weighted-role-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run weighted semantic role bridge CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_role_bridge_weighted_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-role-bridge-weighted-result
          path: researchstrong/semantic_role_bridge_weighted_cv_result.json
          retention-days: 90

  semantic-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn transformers python-dateutil pycountry webcolors
      - name: Run semantic operator residual
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python semantic_operator_residual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-operator-residual-result
          path: researchstrong/semantic_operator_residual_result.json
          retention-days: 90
