name: mem2act-typed-span
on:
  pull_request:
    paths:
      - 'researchstrong/typed_span_diagnostic.py'
      - '.github/workflows/mem2act-typed-span.yml'
  workflow_dispatch:
jobs:
  typed-span:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn
      - name: Run schema-typed span diagnostic
        working-directory: researchstrong
        run: python typed_span_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: mem2act-typed-span-result
          path: researchstrong/typed_span_diagnostic_result.json
