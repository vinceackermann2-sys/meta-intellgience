name: mem2act-gatea-pairwise-cv
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchstrong/gatea_pairwise_cv.py'
      - '.github/workflows/mem2act-gatea-pairwise-cv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gatea-pairwise-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-cache-dir sentence-transformers scikit-learn python-dateutil pycountry webcolors
      - name: Run pairwise development CV
        working-directory: researchstrong
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python gatea_pairwise_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem2act-gatea-pairwise-cv-result
          path: researchstrong/gatea_pairwise_cv_result.json
          retention-days: 90
